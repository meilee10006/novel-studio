name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Go tests
        run: go test ./...
      - name: Dashboard tests
        run: python -m unittest discover -s services/dashboard -p 'test_*.py'
      - name: Dashboard client tests
        run: node --test services/dashboard/test_client.js
      - name: Build release binary
        run: go build -trimpath -o /tmp/novel-core ./cmd/novel-core
      - name: Smoke test release binary
        run: |
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u DEEPSEEK_API_KEY -u LITELLM_API_KEY /tmp/novel-core --version
          mkdir -p /tmp/novel-core-smoke
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u DEEPSEEK_API_KEY -u LITELLM_API_KEY /tmp/novel-core status --project /tmp/novel-core-smoke

  race_core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Race-sensitive provider-free packages
        run: go test -race -count=1 -timeout=10m ./internal/core ./internal/store ./internal/protocol

  race:
    name: race
    needs: [race_core]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require race job to succeed
        env:
          CORE_RESULT: ${{ needs.race_core.result }}
        run: |
          printf 'race_core=%s
' "$CORE_RESULT"
          test "$CORE_RESULT" = success

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: novel-studio:test
          build-args: GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test provider-free container
        run: |
          docker run --rm novel-studio:test --version
          docker run --rm novel-studio:test status --project /workspace
