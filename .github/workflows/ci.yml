name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Provider-free dependency gate
        run: |
          if go list -deps ./cmd/novel-core |
            grep -E '/internal/(agents|llmcodex|models|rag)(/|$)|agentcore'; then
            echo "novel-core regained AI runtime dependency" >&2
            exit 1
          fi
      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi
      - name: Build release binary
        run: go build -trimpath -o /tmp/novel-core ./cmd/novel-core
      - name: Smoke test release binary
        run: |
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u DEEPSEEK_API_KEY -u LITELLM_API_KEY /tmp/novel-core --version
          mkdir -p /tmp/novel-core-smoke
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u DEEPSEEK_API_KEY -u LITELLM_API_KEY /tmp/novel-core status --project /tmp/novel-core-smoke

  race_core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Race-sensitive provider-free packages
        run: go test -race -count=1 -timeout=10m ./internal/core ./internal/store ./internal/protocol

  race:
    name: race
    needs: [race_core]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require race job to succeed
        env:
          CORE_RESULT: ${{ needs.race_core.result }}
        run: |
          printf 'race_core=%s
' "$CORE_RESULT"
          test "$CORE_RESULT" = success

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: novel-studio:test
          build-args: GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test provider-free container
        run: |
          docker run --rm novel-studio:test --version
          docker run --rm novel-studio:test status --project /workspace
